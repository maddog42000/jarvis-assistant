name: Jarvis standalone APK

on:
  workflow_dispatch:
  push:
    branches:
      - "jarvis-3.0/voice-ui-foundation"
    tags:
      - "apk-v*"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build installable standalone release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          yes | "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: NODE_ENV=production ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Copy standalone APK with stable filename
        run: cp android/app/build/outputs/apk/release/app-release.apk Jarvis-Assistant-standalone.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Assistant-standalone
          path: Jarvis-Assistant-standalone.apk
          if-no-files-found: error

      - name: Publish tagged APK release
        if: startsWith(github.ref, 'refs/tags/apk-v')
        uses: softprops/action-gh-release@v2
        with:
          files: Jarvis-Assistant-standalone.apk
          generate_release_notes: true
